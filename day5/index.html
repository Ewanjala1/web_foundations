<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Directory</title>
  <link rel="stylesheet" href="style.css">
  <script src="users.js" defer></script>
</head>
<body>
  <header>
    <h1>User Directory</h1>
  </header>

  <main>
    <section>
      <label for="filter-input">Filter users</label>
      <input type="search" id="filter-input" placeholder="Type a name, username or email" autocomplete="off">

      <p id="loading" hidden>Loading users...</p>
      <p id="error-message" role="alert"></p>

      <ul id="users-list"></ul>
    </section>
  </main>
</body>
</html>
